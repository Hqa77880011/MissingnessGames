[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "missingness-games"
version = "0.1.0"
description = "Missingness-Mechanism Games for Robust Multisensor Representation Learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
missingness-games = "missingness_games.cli:main"

[tool.setuptools.packages.find]
include = ["missingness_games*"]

[tool.setuptools.package-data]
missingness_games = ["heldout.json","vendor/pypots/LICENSE","vendor/timesnet/LICENSE","vendor/biot/LICENSE"]

[project.optional-dependencies]
baselines=["linear-attention-transformer==0.19.1","local-attention==1.11.2","linformer==0.2.3","product-key-memory==0.3.0","axial-positional-embedding==0.3.12","hyper-connections==0.4.11","einx==0.4.3","beartype==0.23.1","colt5-attention==0.11.2"]
